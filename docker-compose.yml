# 로컬 풀스택 실행용 Compose. 루트 Dockerfile.api / Dockerfile.web를 그대로 사용한다.
#   docker compose up --build
#   웹: http://localhost:4173   API: http://localhost:3001/api
#
# 외부 DB 없음: API는 원자적 JSON 파일 스토어(FCP_DATA_DIR)를 사용하므로
# postgres 서비스를 추가하지 않는다. 데이터는 named volume(api-data)에 영속된다.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: "3001"
      # 컨테이너 내부 JSON 스토어 경로. 아래 named volume이 여기에 마운트된다.
      FCP_DATA_DIR: /data
      # 브라우저(웹 컨테이너가 서빙)는 호스트의 localhost:4173에서 로드되므로
      # 그 origin을 허용해야 한다.
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "3001:3001"
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # 브라우저 번들에 박히는 빌드 타임 API 주소(호스트에서 본 API 포트).
        VITE_API_URL: http://localhost:3001/api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4173"
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
