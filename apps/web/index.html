<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가족 돌봄 운영 플랫폼</title>

    <!-- SEO -->
    <meta
      name="description"
      content="돌봄 기록·돌봄비 정산·보험청구를 한 곳에서 간편하게 관리하는 가족 돌봄 운영 플랫폼입니다."
    />
    <meta name="theme-color" content="#4a3fbf" />
    <link rel="canonical" href="https://family-care-platform.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="가족 돌봄 운영 플랫폼" />
    <meta property="og:title" content="가족 돌봄 운영 플랫폼" />
    <meta
      property="og:description"
      content="돌봄 기록·돌봄비 정산·보험청구를 한 곳에서 간편하게 관리하세요."
    />
    <meta property="og:url" content="https://family-care-platform.vercel.app/" />
    <meta property="og:image" content="https://family-care-platform.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="가족 돌봄 운영 플랫폼 - 돌봄 기록·정산·보험청구" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="가족 돌봄 운영 플랫폼" />
    <meta
      name="twitter:description"
      content="돌봄 기록·돌봄비 정산·보험청구를 한 곳에서 간편하게 관리하세요."
    />
    <meta name="twitter:image" content="https://family-care-platform.vercel.app/og.png" />
    <meta name="twitter:image:alt" content="가족 돌봄 운영 플랫폼 - 돌봄 기록·정산·보험청구" />
    <script>
      // No-FOUC: 앱 로드 전에 저장된 테마(또는 시스템 선호)를 즉시 적용한다.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage/matchMedia 사용 불가 환경은 기본 라이트로 둔다. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
